<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- CostMatrixToTree: a 3x3 cost grid (rows = demand) becoming a data tree with one branch per row. -->
  <rect x="1" y="1" width="22" height="22" rx="1.2" fill="#e6e6e6" stroke="#b3b3b3" stroke-width="2"/>
  <g stroke="none">
    <rect x="3.5" y="6" width="2.6" height="2.6" fill="#f52565"/>
    <rect x="6.1" y="6" width="2.6" height="2.6" fill="#fa90b1"/>
    <rect x="8.7" y="6" width="2.6" height="2.6" fill="#feebf1"/>
    <rect x="3.5" y="10.7" width="2.6" height="2.6" fill="#fba5bf"/>
    <rect x="6.1" y="10.7" width="2.6" height="2.6" fill="#ffffff"/>
    <rect x="8.7" y="10.7" width="2.6" height="2.6" fill="#f6396f"/>
    <rect x="3.5" y="15.4" width="2.6" height="2.6" fill="#fee6ed"/>
    <rect x="6.1" y="15.4" width="2.6" height="2.6" fill="#f9779f"/>
    <rect x="8.7" y="15.4" width="2.6" height="2.6" fill="#fbadc5"/>
  </g>
  <g fill="none" stroke="#333333" stroke-width="1.3" stroke-linecap="round">
    <path d="M 14 12 L 19 7.3"/>
    <path d="M 14 12 L 19 12"/>
    <path d="M 14 12 L 19 16.7"/>
  </g>
  <circle cx="14" cy="12" r="1.5" fill="#333333"/>
  <circle cx="19.3" cy="7.3" r="1.6" fill="#f52565"/>
  <circle cx="19.3" cy="12" r="1.6" fill="#fba5bf"/>
  <circle cx="19.3" cy="16.7" r="1.6" fill="#f9779f"/>
</svg>
